<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#06080c">
  <title>Neon Apex — 3D Racing Demo</title>
  <style>
    :root{--bg:#06080c;--panel:rgba(13,17,25,.66);--line:rgba(255,255,255,.12);--text:#f5f7fb;--muted:#8e99aa;--accent:#5df2ff;--accent2:#7b61ff;--good:#79ffb2;--danger:#ff647c;--shadow:0 24px 80px rgba(0,0,0,.42)}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 25%,#121923 0,#06080c 58%,#030407 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent} button{font:inherit;color:inherit} #app{position:fixed;inset:0} canvas{display:block;width:100%;height:100%}
    .ui{position:fixed;inset:0;pointer-events:none}.ui>*{pointer-events:auto}.hidden{display:none!important}
    .topbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(1120px,calc(100% - 24px));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(8,11,16,.54);backdrop-filter:blur(16px);box-shadow:var(--shadow)}.brand-mark{width:25px;height:25px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#061016;font-weight:1000;font-size:13px}.brand strong{font-size:13px;letter-spacing:.14em}.wallet{display:flex;gap:8px;align-items:center}.pill{display:flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(8,11,16,.54);backdrop-filter:blur(16px);font-size:12px;font-weight:800}.pill b{color:var(--accent)}
    .garage-ui{position:absolute;inset:0}.garage-card{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(17,22,31,.82),rgba(7,10,15,.6));backdrop-filter:blur(20px);box-shadow:var(--shadow)}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:900;text-transform:uppercase}.garage-title{display:flex;align-items:end;justify-content:space-between;margin-top:5px}.garage-title h1{margin:0;font-size:clamp(27px,7vw,48px);line-height:.95;letter-spacing:-.05em}.garage-title span{font-size:11px;color:var(--muted);font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.stat{padding:11px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}.stat-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);font-weight:800}.stat-top b{color:var(--text);font-size:11px}.bar{height:6px;margin-top:9px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 16px rgba(93,242,255,.3);transition:width 1.2s cubic-bezier(.2,.9,.2,1)}.customize{display:flex;align-items:center;justify-content:space-between;gap:14px}.customize-label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.04em}.swatches{display:flex;gap:8px}.swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.26);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 5px 14px rgba(0,0,0,.25);cursor:pointer;transition:transform .18s,border-color .18s}.swatch:hover{transform:translateY(-2px)}.swatch.active{border-color:#fff;transform:scale(1.07)}.race-btn{width:100%;margin-top:15px;height:54px;border:0;border-radius:15px;background:linear-gradient(100deg,var(--accent),#8a7cff);color:#061016;font-weight:1000;letter-spacing:.08em;cursor:pointer;box-shadow:0 10px 34px rgba(93,242,255,.22);transition:transform .18s,filter .18s}.race-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}.race-btn:active{transform:translateY(1px)}
    .race-ui{position:absolute;inset:0}.hud-top{position:absolute;top:max(76px,calc(env(safe-area-inset-top) + 64px));left:50%;transform:translateX(-50%);width:min(1120px,calc(100% - 24px));display:flex;justify-content:space-between;align-items:start}.race-badge{padding:8px 11px;border-radius:999px;background:rgba(8,11,16,.5);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--accent)}.map{width:min(170px,27vw);aspect-ratio:1;border-radius:17px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(12,17,24,.9),rgba(5,7,10,.82));backdrop-filter:blur(13px);box-shadow:var(--shadow);padding:10px;position:relative;overflow:hidden}.map:before,.map:after{content:"";position:absolute;inset:18%;border:1px solid rgba(255,255,255,.08);transform:rotate(23deg);border-radius:28% 58% 35% 62%}.map:after{inset:31%;transform:rotate(-20deg);border-color:rgba(93,242,255,.14)}.map-label{position:absolute;left:10px;top:8px;font-size:8px;letter-spacing:.15em;color:var(--muted);z-index:2}.map-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);z-index:3;transition:left .12s,top .12s}.map-car{position:absolute;width:5px;height:9px;border-radius:5px;background:#fff;box-shadow:0 0 10px #fff;z-index:4;transition:left .12s,top .12s}
    .speedo{position:absolute;left:50%;bottom:max(124px,calc(env(safe-area-inset-bottom) + 114px));transform:translateX(-50%);width:160px;height:92px;display:grid;place-items:center}.speed-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle at 50% 52%,rgba(255,255,255,.06),rgba(0,0,0,0) 58%)}.speed-value{position:relative;font-size:34px;font-weight:950;letter-spacing:-.05em}.speed-unit{position:relative;margin-top:-15px;font-size:9px;color:var(--muted);letter-spacing:.2em;font-weight:900}.gear{position:absolute;right:-5px;top:18px;font-size:10px;color:var(--muted);font-weight:900}
    .controls{position:absolute;left:50%;bottom:max(17px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}.steer{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ctrl{height:58px;border:1px solid var(--line);border-radius:17px;background:rgba(8,11,16,.55);backdrop-filter:blur(16px);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;font-weight:1000;cursor:pointer;user-select:none;touch-action:none}.ctrl.main{height:74px;background:linear-gradient(160deg,rgba(93,242,255,.2),rgba(123,97,255,.18));border-color:rgba(93,242,255,.34)}.ctrl:active,.ctrl.active{transform:translateY(2px);background:rgba(255,255,255,.12)}.ctrl-label{display:block;margin-top:4px;font-size:8px;letter-spacing:.14em;color:var(--muted)}.pause{position:absolute;right:12px;bottom:max(100px,calc(env(safe-area-inset-bottom) + 96px));width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(8,11,16,.55);backdrop-filter:blur(15px);font-weight:900;cursor:pointer}
    .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(8,11,16,.82);backdrop-filter:blur(16px);font-size:11px;font-weight:900;opacity:0;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .fade{position:absolute;inset:0;background:#030507;opacity:0;pointer-events:none;transition:opacity .6s}.fade.on{opacity:1}
    @media(min-width:780px){.garage-card{left:46%;bottom:50%;transform:translate(-50%,50%)}.controls{bottom:28px}.speedo{bottom:34px;left:auto;right:24px;transform:none}.pause{right:24px;bottom:128px}.hud-top{top:92px}.map{width:178px}}
    @media(max-width:520px){.brand strong{font-size:11px}.pill{padding:8px 10px}.garage-card{padding:15px}.stats{gap:7px}.stat{padding:9px}.speedo{bottom:max(135px,calc(env(safe-area-inset-bottom) + 125px));width:142px;height:82px}.speed-value{font-size:30px}.controls{gap:7px}.ctrl{height:55px;border-radius:15px}.ctrl.main{height:68px}.map{width:118px}.hud-top{top:max(70px,calc(env(safe-area-inset-top) + 60px))}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div id="app"></div>
<div class="ui">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">N</div><strong>NEON APEX</strong></div>
    <div class="wallet"><div class="pill">◈ <b id="sc">12,480</b> SC</div><div class="pill">LVL <b id="level">18</b></div></div>
  </header>

  <section class="garage-ui" id="garageUI">
    <div class="garage-card">
      <div class="eyebrow">Garage / Street Spec</div>
      <div class="garage-title"><h1>APEX R1</h1><span>CLASS S</span></div>
      <div class="stats">
        <div class="stat"><div class="stat-top"><span>TOP SPEED</span><b>312</b></div><div class="bar"><div class="fill" data-width="92"></div></div></div>
        <div class="stat"><div class="stat-top"><span>ACCELERATION</span><b>8.7</b></div><div class="bar"><div class="fill" data-width="84"></div></div></div>
        <div class="stat"><div class="stat-top"><span>HANDLING</span><b>9.2</b></div><div class="bar"><div class="fill" data-width="89"></div></div></div>
      </div>
      <div class="customize"><span class="customize-label">PAINT</span><div class="swatches" id="swatches"><button class="swatch active" data-color="#4ef0ff" style="background:#4ef0ff" aria-label="Cyan paint"></button><button class="swatch" data-color="#ff537f" style="background:#ff537f" aria-label="Pink paint"></button><button class="swatch" data-color="#8d72ff" style="background:#8d72ff" aria-label="Purple paint"></button><button class="swatch" data-color="#f4d35e" style="background:#f4d35e" aria-label="Gold paint"></button><button class="swatch" data-color="#f0f3f7" style="background:#f0f3f7" aria-label="White paint"></button></div></div>
      <button class="race-btn" id="raceBtn">RACE DEMO&nbsp; →</button>
    </div>
  </section>

  <section class="race-ui hidden" id="raceUI">
    <div class="hud-top"><div class="race-badge">DEMO CIRCUIT / NIGHT RUN</div><div class="map"><span class="map-label">MINIMAP</span><i class="map-dot" id="mapDot"></i><i class="map-car" id="mapCar"></i></div></div>
    <div class="speedo"><div class="speed-ring"></div><div><div class="speed-value" id="speedValue">0</div><div class="speed-unit">KM/H</div></div><div class="gear" id="gear">N</div></div>
    <button class="pause" id="exitBtn" aria-label="Return to garage">×</button>
    <div class="controls">
      <div class="steer"><button class="ctrl" data-key="left">←<span class="ctrl-label">STEER</span></button><button class="ctrl" data-key="right">→<span class="ctrl-label">STEER</span></button></div>
      <button class="ctrl main" data-key="gas">▲<span class="ctrl-label">GAS</span></button>
      <button class="ctrl" data-key="brake">▼<span class="ctrl-label">BRAKE / REV</span></button>
    </div>
    <div class="toast" id="toast">DRIVE THE APEX</div>
  </section>
  <div class="fade" id="fade"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  let scene,camera,renderer,clock;
  let car,bodyPaint,trim,turntable,driveTrack;
  let state='garage', transition=0;
  let speed=0, heading=0, distance=0, steer=0;
  const keys={gas:false,brake:false,left:false,right:false};
  const maxForward=76, maxReverse=-24, accel=38, brakeForce=54, friction=13;
  const garageUI=document.getElementById('garageUI'), raceUI=document.getElementById('raceUI'), fade=document.getElementById('fade');
  const speedValue=document.getElementById('speedValue'), gearEl=document.getElementById('gear'), mapCar=document.getElementById('mapCar');

  init();
  animate();

  function init(){
    scene=new THREE.Scene(); scene.background=new THREE.Color(0x06080c); scene.fog=new THREE.FogExp2(0x06080c,.013);
    camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,800);
    renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.outputEncoding=THREE.sRGBEncoding; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.getElementById('app').appendChild(renderer.domElement);
    clock=new THREE.Clock();
    scene.add(new THREE.HemisphereLight(0x9ab8ff,0x05070a,1.4));
    const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(8,14,10); key.castShadow=true; key.shadow.mapSize.set(1024,1024); key.shadow.camera.left=-35; key.shadow.camera.right=35; key.shadow.camera.top=35; key.shadow.camera.bottom=-35; scene.add(key);
    const cyan=new THREE.PointLight(0x4ef0ff,18,80); cyan.position.set(-10,8,10); scene.add(cyan); const violet=new THREE.PointLight(0x7b61ff,15,70); violet.position.set(12,5,-10); scene.add(violet);
    buildGarage(); buildRaceTrack(); buildCar(); setupUI(); onResize(); window.addEventListener('resize',onResize);
    camera.position.set(8.8,5.2,9.6); camera.lookAt(0,1,0);
  }

  function mat(color,rough=.42,metal=.55){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
  function box(w,h,d,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}
  function buildGarage(){
    const floor=new THREE.Mesh(new THREE.CircleGeometry(24,96),new THREE.MeshStandardMaterial({color:0x080c12,roughness:.72,metalness:.28})); floor.rotation.x=-Math.PI/2; floor.position.y=-.02; floor.receiveShadow=true; scene.add(floor);
    const grid=new THREE.GridHelper(44,44,0x173645,0x0d1821); grid.position.y=.02; grid.material.transparent=true; grid.material.opacity=.36; scene.add(grid); turntable=new THREE.Group(); scene.add(turntable);
    const ring=new THREE.Mesh(new THREE.RingGeometry(6.4,6.7,96),new THREE.MeshBasicMaterial({color:0x4ef0ff,transparent:true,opacity:.2,side:THREE.DoubleSide})); ring.rotation.x=-Math.PI/2; ring.position.y=.04; turntable.add(ring);
  }
  function buildRaceTrack(){
    driveTrack=new THREE.Group(); driveTrack.visible=false; scene.add(driveTrack);
    const road=new THREE.Mesh(new THREE.PlaneGeometry(26,500),new THREE.MeshStandardMaterial({color:0x10151c,roughness:.95,metalness:.05})); road.rotation.x=-Math.PI/2; road.position.y=-.03; road.receiveShadow=true; driveTrack.add(road);
    const lane=new THREE.GridHelper(500,100,0x24303c,0x111820); lane.rotation.x=0; lane.position.y=.015; lane.material.transparent=true; lane.material.opacity=.28; driveTrack.add(lane);
    for(let z=-240;z<250;z+=10){const d=box(.12,.025,5,mat(0x65717f,.9,.05),0,.04,z);d.castShadow=false;driveTrack.add(d)}
    for(const x of [-12,12]){const curb=box(.45,.3,500,mat(0x202933,.85,.1),x,.12,0);driveTrack.add(curb)}
    for(let z=-220;z<235;z+=22){
      const left=box(.18,.7,.18,mat(0x4ef0ff,.25,.6),-12.5,.45,z); const right=box(.18,.7,.18,mat(0x7b61ff,.25,.6),12.5,.45,z); driveTrack.add(left,right);
    }
  }
  function buildCar(){
    car=new THREE.Group();
    bodyPaint=mat(0x4ef0ff,.28,.72); trim=mat(0x0a0d12,.22,.8); const glass=new THREE.MeshPhysicalMaterial({color:0x0b141e,roughness:.08,metalness:.45,transmission:.1,transparent:true,opacity:.82}); const tire=mat(0x090b0e,.9,.05); const rim=mat(0xc5d2df,.22,.9);
    const chassis=box(3.6,.48,7.2,trim,0,.72,0); chassis.scale.set(1,1,.92); car.add(chassis);
    const hood=box(3.34,.48,2.2,bodyPaint,0,1.05,-2.15); car.add(hood);
    const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.75,1.05,2.7),glass); cabin.position.set(0,1.45,.35); cabin.rotation.x=-.06; cabin.castShadow=true; car.add(cabin);
    const roof=box(2.8,.22,1.95,bodyPaint,0,1.98,.3); roof.rotation.x=-.06; car.add(roof);
    const nose=box(3.28,.22,.7,bodyPaint,0,.83,-3.15); car.add(nose);
    const spoiler=box(3.3,.15,.35,bodyPaint,0,1.45,3.2); spoiler.position.y=1.45; car.add(spoiler); const supports=[-1.15,1.15].map(x=>box(.12,.6,.12,trim,x,1.2,3.06)); supports.forEach(s=>car.add(s));
    const splitter=box(3.5,.12,.4,mat(0x11151b,.35,.65),0,.56,-3.52); car.add(splitter);
    [[-1.75,.62,-2.25],[1.75,.62,-2.25],[-1.75,.62,2.15],[1.75,.62,2.15]].forEach(([x,y,z])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.4,24),tire);w.rotation.z=Math.PI/2;w.position.set(x,y,z);w.castShadow=true;car.add(w);const r=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.43,20),rim);r.rotation.z=Math.PI/2;r.position.copy(w.position);r.position.x+=x<0?.21:-.21;car.add(r)});
    const lampMat=new THREE.MeshBasicMaterial({color:0xdffcff}); for(const x of [-1.2,1.2]){const l=box(.72,.12,.08,lampMat,x,1.03,-3.56);car.add(l)}
    const tailMat=new THREE.MeshBasicMaterial({color:0xff315e}); for(const x of [-1.35,1.35]){const l=box(.7,.11,.08,tailMat,x,1.0,3.58);car.add(l)}
    car.position.set(0,.45,0); turntable.add(car);
  }
  function setupUI(){
    document.querySelectorAll('.fill').forEach(e=>requestAnimationFrame(()=>e.style.width=e.dataset.width+'%'));
    document.querySelectorAll('.swatch').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.swatch').forEach(b=>b.classList.remove('active'));btn.classList.add('active');bodyPaint.color.set(btn.dataset.color)}));
    document.getElementById('raceBtn').addEventListener('click',startRace); document.getElementById('exitBtn').addEventListener('click',returnGarage);
    document.querySelectorAll('.ctrl').forEach(btn=>{
      const k=btn.dataset.key; const down=e=>{e.preventDefault();keys[k]=true;btn.classList.add('active')}; const up=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('active')}; btn.addEventListener('pointerdown',down); btn.addEventListener('pointerup',up); btn.addEventListener('pointercancel',up); btn.addEventListener('pointerleave',up);
    });
    window.addEventListener('keydown',e=>{const k=mapKey(e.key);if(k){e.preventDefault();keys[k]=true}}); window.addEventListener('keyup',e=>{const k=mapKey(e.key);if(k){e.preventDefault();keys[k]=false}});
  }
  function mapKey(k){k=k.toLowerCase(); if(k==='w'||k==='arrowup')return'gas'; if(k==='s'||k==='arrowdown')return'brake'; if(k==='a'||k==='arrowleft')return'left'; if(k==='d'||k==='arrowright')return'right'; return null}
  function startRace(){
    state='transition'; transition=0; fade.classList.add('on'); setTimeout(()=>{garageUI.classList.add('hidden');raceUI.classList.remove('hidden');driveTrack.visible=true;turntable.visible=false; car.position.set(0,.45,8);car.rotation.set(0,0,0);heading=0;speed=0;distance=0; camera.position.set(0,4.4,15.8);camera.lookAt(0,1.2,2); fade.classList.remove('on');state='race'; showToast('DRIVE THE APEX')},420);
  }
  function returnGarage(){state='transition';fade.classList.add('on');setTimeout(()=>{raceUI.classList.add('hidden');garageUI.classList.remove('hidden');driveTrack.visible=false;turntable.visible=true;camera.position.set(8.8,5.2,9.6);camera.lookAt(0,1,0);fade.classList.remove('on');state='garage'},420)}
  function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
  function updateGarage(dt){turntable.rotation.y+=dt*.14}
  function updateRace(dt){
    const gas=keys.gas, reverse=keys.brake && !gas; const steerInput=(keys.left?-1:0)+(keys.right?1:0);
    if(gas) speed+=accel*dt; else if(reverse) speed-=brakeForce*dt; else {const f=friction*dt; speed=Math.abs(speed)>f?speed-Math.sign(speed)*f:0}
    speed=Math.max(maxReverse,Math.min(maxForward,speed)); const normalized=Math.min(1,Math.abs(speed)/maxForward); const turnRate=(0.65+normalized*2.2)*(speed>=0?1:-1); heading+=steerInput*turnRate*dt;
    car.rotation.y=heading; car.position.x+=Math.sin(heading)*speed*dt*.34; car.position.z+=Math.cos(heading)*speed*dt; distance+=Math.abs(speed)*dt;
    car.position.x=Math.max(-9.8,Math.min(9.8,car.position.x)); if(car.position.z>238){car.position.z=-238} if(car.position.z<-238){car.position.z=238}
    const target=new THREE.Vector3(car.position.x-Math.sin(heading)*8,3.4,car.position.z-Math.cos(heading)*8); camera.position.lerp(target,1-Math.pow(.001,dt)); const look=new THREE.Vector3(car.position.x,1.05,car.position.z+Math.cos(heading)*7+Math.sin(heading)*2); camera.lookAt(look);
    speedValue.textContent=Math.round(Math.abs(speed)*3.6); gearEl.textContent=speed<-.5?'R':Math.abs(speed)<.7?'N':Math.max(1,Math.min(7,Math.ceil(Math.abs(speed)/10)));
    const mapX=50+(car.position.x/10)*38; const mapY=50-(car.position.z/240)*38; mapCar.style.left=mapX+'%'; mapCar.style.top=mapY+'%';
    mapCar.style.transform='translate(-50%,-50%) rotate('+(-heading*57.3)+'deg)';
  }
  function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033); if(state==='garage')updateGarage(dt); if(state==='race')updateRace(dt); renderer.render(scene,camera)}
  function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
})();
</script>
</body>
</html>
